[package]
name = "sleighride"
version = "0.1.0"
edition = "2021"
description = "Kart racing with Santa's runaway helpers, in the terminal"

[[bin]]
name = "sleighride"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
gilrs = { version = "0.11", optional = true }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
iroh = "1.0.2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }
socket2 = { version = "0.6", features = ["all"] }

[features]
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[profile.release]
debug = 1
